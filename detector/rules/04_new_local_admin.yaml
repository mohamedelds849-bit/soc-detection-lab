id: new_local_admin
name: New local account added to Administrators
attack: T1136.001 / T1098
severity: high
type: sequence
group_by: [host]
window_seconds: 120
steps:
  - match:
      all:
        - field: source
          equals: win_security
        - field: event_id
          equals: 4720
    min_count: 1
  - match:
      all:
        - field: source
          equals: win_security
        - field: event_id
          equals: 4732
        # 4732: TargetSid/TargetUserName = the GROUP, MemberSid = the account added.
        # S-1-5-32-544 = BUILTIN\Administrators (language-independent).
        - field: TargetSid
          equals: S-1-5-32-544
    min_count: 1
triage: >
  A local account was created (EventID 4720) and shortly after added to the
  Administrators group (EventID 4732) on the same host. Confirm this change was
  authorized; attackers create admin accounts for persistence and privilege.
