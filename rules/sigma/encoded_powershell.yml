title: Suspicious PowerShell Encoded Command
id: eed91baf-1beb-4f5d-89a0-249e80885815
status: experimental
description: Detects PowerShell launched with -EncodedCommand or one of its abbreviations (-e, -ec, -en, -enc, -enco), commonly used to obfuscate command intent.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Mohamed Elansari
date: 2026-03-10
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_enc:
    CommandLine|re: '(?i)\s-(e|ec|en|enc|enco|encodedcommand)\s'
  condition: selection_img and selection_enc
fields:
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Legitimate administration or software that uses encoded commands
level: high
tags:
  - attack.execution
  - attack.t1059.001
