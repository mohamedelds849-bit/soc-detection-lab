title: Web Shell-Like Request In Access Log
id: 076ca304-27f3-46b0-9a34-ec083488b7a3
status: experimental
description: Detects HTTP requests to PHP endpoints with command-execution style parameters or suspicious upload paths, indicating possible web shell interaction.
references:
  - https://attack.mitre.org/techniques/T1505/003/
author: Mohamed Elansari
date: 2026-03-10
logsource:
  category: webserver
detection:
  selection_param:
    cs-uri-query|re: '(?i)(cmd=|exec=|eval|whoami)'
  selection_path:
    cs-uri-stem|re: '(?i)(shell\.php|/uploads/.+\.php|up\.php|evil\.php)'
  condition: 1 of selection_*
fields:
  - c-ip
  - cs-method
  - cs-uri-stem
  - cs-uri-query
  - sc-status
falsepositives:
  - Legitimate application that passes a parameter literally named cmd or containing "eval"
  - Legitimate PHP upload handlers under /uploads/
level: high
tags:
  - attack.persistence
  - attack.t1505.003
