title: Windows Security Event Log Cleared
id: c3895c3a-4203-4916-9652-e1245421451e
status: experimental
description: Detects clearing of the Windows Security audit log (EventID 1102), an anti-forensics action (ATT&CK v19 T1685.005, formerly T1070.001).
references:
  - https://attack.mitre.org/techniques/T1685/005/
author: Mohamed Elansari
date: 2026-03-10
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
fields:
  - SubjectUserName
falsepositives:
  - Rare authorized log maintenance
level: high
tags:
  - attack.defense-impairment
  - attack.t1685.005
