title: Successful SSH Login After Brute Force
id: feb47221-b0bc-4c06-84b4-e9b65fbe4759
status: experimental
description: >
  Detects a successful SSH password login from a source IP that triggered the SSH brute-force
  correlation (8+ failures / 2m) just before, within 3 minutes - likely credential compromise.
  Chained Sigma v2 correlation: references lab_ssh_failed_password_burst defined in ssh_bruteforce.yml,
  so convert both files together.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Mohamed Elansari
date: 2026-03-10
correlation:
  type: temporal_ordered
  rules:
    - lab_ssh_failed_password_burst
    - lab_ssh_accepted_password
  group-by:
    - src_ip
  timespan: 3m
falsepositives:
  - A legitimate user who mistyped several times then logged in
level: critical
tags:
  - attack.credential-access
  - attack.t1110
