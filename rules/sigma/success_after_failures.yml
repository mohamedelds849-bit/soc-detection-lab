title: SSH Accepted Password (base event)
id: 9b6e2dd3-a737-4d0c-9242-e7bc85f6c4b0
name: lab_ssh_accepted_password
status: experimental
description: Successful SSH password authentication. Base rule for the temporal correlation below; not alerted on its own.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Mohamed Elansari
date: 2026-03-10
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: 'Accepted password for'
  condition: selection
fields:
  - src_ip
  - user
falsepositives:
  - Every normal password login (expected)
level: informational
