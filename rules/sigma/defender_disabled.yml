title: Microsoft Defender Real-Time Protection Disabled
id: 6b8ac556-d60d-42f6-b5ad-9cc7708d88f6
status: experimental
description: Detects disabling of Microsoft Defender real-time monitoring via Set-MpPreference, a common defense-impairment step (ATT&CK v19 T1685, formerly T1562.001).
references:
  - https://attack.mitre.org/techniques/T1685/
author: Mohamed Elansari
date: 2026-03-10
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains: 'DisableRealtimeMonitoring'
  condition: selection
fields:
  - CommandLine
  - User
falsepositives:
  - Authorized maintenance that temporarily disables AV
level: critical
tags:
  - attack.defense-impairment
  - attack.t1685
