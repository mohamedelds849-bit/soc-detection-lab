title: Microsoft Defender Real-Time Protection Disabled (Defender 5001)
id: 033bc52b-ecbd-4cb4-aa35-460bb5bcbb1c
status: experimental
description: >
  Detects the Defender state change itself (Microsoft-Windows-Windows Defender/Operational EventID 5001,
  "Real-time protection is disabled"). Complements the command-line rule above: it also catches disabling
  via the GUI / GPO, and it does NOT fire when Tamper Protection blocked the Set-MpPreference attempt.
references:
  - https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus
  - https://attack.mitre.org/techniques/T1685/
author: Mohamed Elansari
date: 2026-03-10
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID: 5001
  condition: selection
fields:
  - Computer
falsepositives:
  - Authorized maintenance that temporarily disables AV
level: high
tags:
  - attack.defense-impairment
  - attack.t1685
